server:
  host: 0.0.0.0
  port: 8081

decision:
  hard_block_confidence: 0.95
  policy_block_confidence: 0.85
  escalate_confidence: 0.65
  allow_confidence: 0.80

# These classify effects, not permissions. Permissions and confirmation rules
# always come from the trusted request policy_context. Unknown tools need review.
sink:
  external_communication:
    - email_send
    - email_draft
    - slack_send
    - webhook_post
    - http_post
  financial_execution:
    - payment_prepare
    - payment_execute
    - payment_confirm
    - wire_transfer
    - payment_submit
  state_changing:
    - ticket_update
    - case_note_create
    - incident_create
    - incident_update
    - remediation_prepare
    - remediation_execute
    - case_update
    - config_update
    - firewall_update
    - host_isolate
  security_config:
    - monitoring_disable
    - alert_suppress
    - log_disable
    - rule_delete
  memory_persistence:
    - memory_write
    - knowledge_save
    - note_save
